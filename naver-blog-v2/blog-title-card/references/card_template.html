<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1080px; background: #000; overflow: hidden; }
  .card { position: relative; width: 1080px; height: 1080px; overflow: hidden;
          font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", "Noto Sans KR", sans-serif; }
  /* zoom crops the small corner mark that free image tools add */
  .bg { position: absolute; inset: 0; background: url("{{BG}}") center / cover no-repeat; transform: scale({{ZOOM}}); transform-origin: 0 0; }
  .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 35%, rgba(0,0,0,.78) 100%); }
  .tag { position: absolute; left: 64px; top: 56px; padding: 10px 22px; border-radius: 999px; font-size: 30px; font-weight: 700;
         color: #fff; background: rgba(0,0,0,.45); border: 2px solid {{ACCENT}}; }
  .box { position: absolute; left: 64px; right: 64px; bottom: 84px; color: #fff; }
  .chip { font-size: 32px; font-weight: 700; color: {{ACCENT}}; margin-bottom: 18px; }
  .l1, .l2 { font-size: 86px; font-weight: 900; line-height: 1.12; letter-spacing: -2px; text-shadow: 0 4px 18px rgba(0,0,0,.65); }
  .l2 u { text-decoration: none; border-bottom: 10px solid {{ACCENT}}; }
  .sub { margin-top: 22px; font-size: 36px; font-weight: 500; color: #e8e8e8; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
</style>
</head>
<body>
<div class="card">
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="tag">{{TAG}}</div>
  <div class="box">
    <div class="chip">{{CHIP}}</div>
    <div class="l1">{{L1}}</div>
    <div class="l2">{{L2}}</div>
    <div class="sub">{{SUB}}</div>
  </div>
</div>
</body>
</html>
